name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y bison
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Grammar checks
        run: python3 tools/check_grammar.py
      - name: Lexer against the reference grammar
        run: python3 tools/compare_lexers.py
      - name: Parser against the reference grammar, tree for tree
        run: python3 tools/compare_parsers.py
      - name: Grammar has no LALR(1) conflicts
        run: python3 tools/check_lalr.py
